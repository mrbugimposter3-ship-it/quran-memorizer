<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e50">
  <title>Hifz Companion — Quran Memorization</title>
  <meta name="description" content="A fun, interactive Quran memorization app with a verse builder, matching game, and quizzes.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">﷽</span>
      <div class="brand-text">
        <h1>Hifz Companion</h1>
        <p>Quran Memorization</p>
      </div>
    </div>
    <div class="stat-pills">
      <span class="pill" id="pill-points" title="Points">⭐ 0</span>
      <span class="pill" id="pill-streak" title="Day streak">🔥 0</span>
    </div>
  </header>

  <main id="app">
    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <div class="hero">
        <h2>Welcome back ✨</h2>
        <p id="home-greeting">Keep building your hifz, one ayah at a time.</p>
        <div class="hero-actions">
          <button class="btn primary" data-go="builder">🧱 Verse Builder</button>
          <button class="btn accent" data-go="matching">🧩 Matching</button>
          <button class="btn gold" data-go="quiz">🎯 Quiz</button>
        </div>
      </div>

      <h3 class="section-title">Continue learning</h3>
      <div class="quick-list" id="continue-list"></div>

      <h3 class="section-title">All Surahs</h3>
      <div class="surah-grid" id="surah-grid"></div>
    </section>

    <!-- SURAH VIEW -->
    <section class="screen" id="screen-surah">
      <button class="back" data-go="home">← Back</button>
      <div class="surah-header" id="surah-header"></div>
      <div class="toolbar">
        <label class="toggle"><input type="checkbox" id="toggle-translit" checked> Transliteration</label>
        <label class="toggle"><input type="checkbox" id="toggle-translation" checked> Translation</label>
        <button class="btn small" id="practice-surah">Practice this surah</button>
      </div>
      <div class="verse-list" id="verse-list"></div>
    </section>

    <!-- PLAY (games) -->
    <section class="screen" id="screen-play">
      <h2 class="section-title">Play &amp; Practice</h2>
      <div class="game-cards">
        <button class="game-card" data-go="builder">
          <span class="emoji">🧱</span>
          <h3>Verse Builder</h3>
          <p>Reveal a verse word by word and rebuild it from memory.</p>
        </button>
        <button class="game-card" data-go="matching">
          <span class="emoji">🧩</span>
          <h3>Matching Game</h3>
          <p>Match transliteration to its meaning.</p>
        </button>
        <button class="game-card" data-go="quiz">
          <span class="emoji">🎯</span>
          <h3>Rapid Quiz</h3>
          <p>Multiple-choice drills to test your recall.</p>
        </button>
      </div>
    </section>

    <!-- PROGRESS -->
    <section class="screen" id="screen-progress">
      <h2 class="section-title">Your Progress</h2>
      <div class="stats-cards" id="stats-cards"></div>
      <h3 class="section-title">Memorized verses</h3>
      <div id="memorized-list" class="memorized-list"></div>
      <button class="btn danger small" id="reset-progress">Reset all progress</button>
    </section>

    <!-- VERSE BUILDER -->
    <section class="screen" id="screen-builder">
      <button class="back" data-go="play">← Back</button>
      <div class="game-stage">
        <div id="builder-setup" class="setup">
          <label>Surah
            <select id="builder-surah"></select>
          </label>
          <label>Ayah <small>(0 = random)</small>
            <input type="number" id="builder-ayah" min="0" value="0">
          </label>
          <button class="btn primary" id="builder-start">Start building</button>
        </div>

        <div id="builder-play" class="builder-play hidden">
          <p class="builder-prompt" id="builder-translation"></p>
          <div class="word-chips" id="builder-words"></div>
          <div class="builder-controls">
            <button class="btn" id="builder-reveal">Reveal next word</button>
            <button class="btn subtle" id="builder-reveal-all">Reveal all</button>
          </div>
          <div class="builder-grade hidden" id="builder-grade">
            <p>How did you do?</p>
            <button class="btn success" id="grade-knew">😄 I knew it</button>
            <button class="btn warn" id="grade-struggle">🙂 Struggled</button>
          </div>
        </div>
      </div>
    </section>

    <!-- MATCHING -->
    <section class="screen" id="screen-matching">
      <button class="back" data-go="play">← Back</button>
      <div class="game-stage">
        <div id="matching-setup" class="setup">
          <label>Surah
            <select id="matching-surah"></select>
          </label>
          <button class="btn primary" id="matching-start">Deal cards</button>
        </div>
        <div id="matching-board" class="matching-board hidden">
          <div class="matching-stats">
            <span id="match-count"></span>
            <span id="match-moves"></span>
          </div>
          <div class="matching-cols">
            <div class="match-col" id="col-left"></div>
            <div class="match-col" id="col-right"></div>
          </div>
        </div>
        <div id="matching-result" class="result-box hidden"></div>
      </div>
    </section>

    <!-- QUIZ -->
    <section class="screen" id="screen-quiz">
      <button class="back" data-go="play">← Back</button>
      <div class="game-stage">
        <div id="quiz-setup" class="setup">
          <label>Surah <small>(all = random)</small>
            <select id="quiz-surah"></select>
          </label>
          <button class="btn primary" id="quiz-start">Start quiz</button>
        </div>
        <div id="quiz-play" class="quiz-play hidden">
          <div class="quiz-progress"><span id="quiz-num"></span></div>
          <div class="quiz-prompt" id="quiz-prompt"></div>
          <div class="quiz-options" id="quiz-options"></div>
        </div>
        <div id="quiz-result" class="result-box hidden"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-go="home"><span>🏠</span>Home</button>
    <button class="tab" data-go="surah"><span>📖</span>Read</button>
    <button class="tab" data-go="play"><span>🎮</span>Play</button>
    <button class="tab" data-go="progress"><span>📈</span>Progress</button>
  </nav>

  <div class="toast hidden" id="toast"></div>

  <script src="data/quran.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
